name: Question
description: Ask how something works or how to set it up.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: "**Issues are public.** Never paste API tokens or confidential vault data."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both / not app-specific
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
